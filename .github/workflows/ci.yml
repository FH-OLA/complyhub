name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Required checks: TypeScript, ESLint, unit/API tests, production build.
  # This job must pass before any branch can be merged.
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality (TS · Lint · Tests · Build)
    runs-on: ubuntu-latest

    env:
      # Public env vars that Next.js needs at build time.
      NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BASE_URL:          ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      # Server env vars required by API routes at build/test time.
      SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMPANIES_HOUSE_API_KEY:       ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      ANTHROPIC_API_KEY:             ${{ secrets.ANTHROPIC_API_KEY }}
      STRIPE_SECRET_KEY:             ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET:         ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      ADMIN_EMAILS:                  ${{ secrets.ADMIN_EMAILS }}
      RESEND_API_KEY:                ${{ secrets.RESEND_API_KEY }}
      UNSUBSCRIBE_SECRET:            ${{ secrets.UNSUBSCRIBE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit & API tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Production build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Playwright E2E — runs as a separate job and does NOT block the workflow
  # on failure. Once the suite has stabilised this will be promoted to a
  # required check by removing `continue-on-error`.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright — non-blocking)
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true       # ← remove once suite is stable

    env:
      NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BASE_URL:          ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMPANIES_HOUSE_API_KEY:       ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      ANTHROPIC_API_KEY:             ${{ secrets.ANTHROPIC_API_KEY }}
      STRIPE_SECRET_KEY:             ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET:         ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      ADMIN_EMAILS:                  ${{ secrets.ADMIN_EMAILS }}
      RESEND_API_KEY:                ${{ secrets.RESEND_API_KEY }}
      UNSUBSCRIBE_SECRET:            ${{ secrets.UNSUBSCRIBE_SECRET }}
      PLAYWRIGHT_TEST_EMAIL:         ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD:      ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      PLAYWRIGHT_PRO_EMAIL:          ${{ secrets.PLAYWRIGHT_PRO_EMAIL }}
      PLAYWRIGHT_PRO_PASSWORD:       ${{ secrets.PLAYWRIGHT_PRO_PASSWORD }}
      PLAYWRIGHT_TEST_COMPANY_NUMBER: ${{ secrets.PLAYWRIGHT_TEST_COMPANY_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
